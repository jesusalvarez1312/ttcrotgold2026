for(let i=-7;i<=7;i++){el('line',{x1:i,y1:-7,x2:i,y2:7,stroke:'#cdd9ee','stroke-width':.03});el('line',{x1:-7,y1:i,x2:7,y2:i,stroke:'#cdd9ee','stroke-width':.03})}
el('rect',{x:-7,y:-7,width:14,height:14,fill:'none',stroke:'#7d97c2','stroke-width':.07});
el('path',{d:'M-.3 0H.3M0 -.3V.3',stroke:'#14213d','stroke-width':.08});
const fm=v=>String(v).replace('.',',').replace('-','−');
for(let v=-6;v<=6;v+=2){el('text',{x:v,y:7.6,'font-size':.42,'text-anchor':'middle',fill:'#7d97c2'}).textContent=fm(v);el('text',{x:-7.35,y:v+.15,'font-size':.42,'text-anchor':'end',fill:'#7d97c2'}).textContent=fm(v)}
const gT=el('g',{}),gF=el('g',{}),gP=el('g',{});gT.style.display='none';
function walk(a,c,o,w){const m=o=='yx'?[a[0],c[1]]:[c[0],a[1]],l1=Math.hypot(m[0]-a[0],m[1]-a[1]),l2=Math.hypot(c[0]-m[0],c[1]-m[1]),L=l1+l2;if(!L)return a;const d=w*L;
 if(d<=l1){const f=l1?d/l1:0;return[a[0]+(m[0]-a[0])*f,a[1]+(m[1]-a[1])*f]}const f=(d-l1)/l2;return[m[0]+(c[0]-m[0])*f,m[1]+(c[1]-m[1])*f]}
function wpt(L,w){let k=0;while(k<L.length-2&&w>L[k+1][0])k++;const a=L[k],b=L[k+1],f=(w-a[0])/(b[0]-a[0]);return[a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f]}
function rough(i,n){const W=D.W&&D.W[i]&&D.W[i][n];if(W)return W.map(q=>[q[1],q[2]]);const a=B[i].p[n],c=B[i+1].p[n],dx=c[0]-a[0],dy=c[1]-a[1],ax=Math.abs(dx),ay=Math.abs(dy);
 if(Math.abs(ax-ay)<.3||ax<.3||ay<.3)return[a,c];const m=ay>ax?[a[0],a[1]+Math.sign(dy)*(ay-ax)]:[a[0]+Math.sign(dx)*(ax-ay),a[1]];return[a,m,c]}
function smooth(P){P=P.filter((p,k)=>k==0||Math.hypot(p[0]-P[k-1][0],p[1]-P[k-1][1])>1e-6);if(P.length<3)return P;const out=[P[0]];
 for(let k=1;k<P.length-1;k++){const a=P[k-1],b=P[k],c=P[k+1],l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]),r=Math.min(.7,l1/2,l2/2);
  const p0=[b[0]+(a[0]-b[0])*r/l1,b[1]+(a[1]-b[1])*r/l1],p2=[b[0]+(c[0]-b[0])*r/l2,b[1]+(c[1]-b[1])*r/l2];
  for(let j=0;j<=10;j++){const u=j/10,v=1-u;out.push([v*v*p0[0]+2*u*v*b[0]+u*u*p2[0],v*v*p0[1]+2*u*v*b[1]+u*u*p2[1]])}}
 out.push(P[P.length-1]);return out}
function arc(P){const L=[0];for(let k=1;k<P.length;k++)L.push(L[k-1]+Math.hypot(P[k][0]-P[k-1][0],P[k][1]-P[k-1][1]));return L}
function along(P,L,w){const d=w*L[L.length-1];let k=0;while(k<L.length-2&&L[k+1]<d)k++;const f=L[k+1]>L[k]?(d-L[k])/(L[k+1]-L[k]):0;return[P[k][0]+(P[k+1][0]-P[k][0])*f,P[k][1]+(P[k+1][1]-P[k][1])*f]}
const PC={};function mv(i,n,w){const key=i+n;if(!PC[key]){const P=smooth(rough(i,n));PC[key]=[P,arc(P)]}if(PC[key][0].length<2)return PC[key][0][0];return along(PC[key][0],PC[key][1],w)}
function pos(n,s){const i=seg(s);if(s<=TT[i][1]||i==B.length-1)return B[i].p[n];
 let w=(s-TT[i][1])/(TT[i+1][0]-TT[i][1]);w=w<.5?2*w*w:1-2*(1-w)*(1-w);return mv(i,n,w)}
const tr={};for(const n of N)tr[n]=el('polyline',{fill:'none',stroke:'#14213d','stroke-width':.05,opacity:.35,'stroke-dasharray':'.15 .1'},gT);
const dot={},lab={};for(const n of N){dot[n]=el('circle',{r:.36,fill:C[n],stroke:'#fff','stroke-width':.05},gP);lab[n]=el('text',{'font-size':n.length>1?.32:.4,'font-weight':700,fill:TC[n],'text-anchor':'middle','dominant-baseline':'central'},gP);lab[n].textContent=n}
let t=0,play=null,spd=1,cur=-1;const sl=document.getElementById('sl');sl.max=Math.round(END*10);
const title=i=>'Bild '+(i+1)+(B[i].n?' · '+B[i].n:'');
function paths(i){for(const n of N){const pts=[];if(i<B.length-1){for(let k=0;k<=60;k++){const w=k/60;pts.push(mv(i,n,w).join(','))}}tr[n].setAttribute('points',pts.join(' '))}}

const fp=v=>fm(Math.abs(v));
function where(x,y){const sx=x==0?'Mitte':'Seite '+fp(x)+(x<0?' links':' rechts');const sy=y==0?'auf der Linie':(y<0?'hinten ':'vorne ')+fp(y);return sx+' · '+sy}
function folOf(i){const f=D.F[i];return f?f.map(q=>({x:q[0],y:q[1],n:q[2]||'',c:q[3]||(q[2]?C[q[2]]:'#555'),leader:!q[3]&&q[2]})):[]}
function renderCur(i){const b=B[i];let h='<h2>'+title(i)+'</h2>';
 if(b.a)h+='<div class="note"><b>Anmerkungen</b>'+b.a.replace(/</g,'&lt;')+'</div>';
 h+='<table><tr><th>Leader</th><th>Position</th><th>x : y</th></tr>';
 N.forEach(n=>{if(b.x&&b.x.includes(n))return;const p=b.p[n];h+='<tr><td><span class="dot2" style="background:'+C[n]+'"></span>'+n+'</td><td>'+where(p[0],p[1])+'</td><td>'+fm(p[0])+' : '+fm(p[1])+'</td></tr>'});
 h+='</table>';const fl=folOf(i);
 if(fl.length){h+='<table style="margin-top:10px"><tr><th>Follower</th><th>Position</th><th>x : y</th></tr>';
  fl.forEach(q=>{h+='<tr><td><span class="dot2 f" style="border-color:'+q.c+'"></span>'+(q.n?(q.leader?'zu '+q.n:q.n):'–')+'</td><td>'+where(q.x,q.y)+'</td><td>'+fm(q.x)+' : '+fm(q.y)+'</td></tr>'});h+='</table>'}
 h+='<div class="leg">PM = Paar Mitte · W = Team Weiß · S = Team Schwarz</div>';
 document.getElementById('cur').innerHTML=h}
const tip=document.getElementById('tip');let tipT=null;
function showTip(ev,txt){tip.textContent=txt;tip.style.display='block';const r=ev.clientX!==undefined?ev:ev.touches[0];
 tip.style.left=Math.min(window.innerWidth-tip.offsetWidth-8,Math.max(8,r.clientX-tip.offsetWidth/2))+'px';tip.style.top=(r.clientY-44)+'px';clearTimeout(tipT);tipT=setTimeout(()=>tip.style.display='none',2500)}
S.addEventListener('click',ev=>{const pt=S.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(S.getScreenCTM().inverse());
 const s=t/10;let best=null;for(const n of N){if(dot[n].style.display=='none')continue;const p=pos(n,s),dd=Math.hypot(p[0]-q.x,p[1]-q.y);if(dd<.6&&(!best||dd<best[0]))best=[dd,n+': '+where(Math.round(p[0]*10)/10,Math.round(p[1]*10)/10)]}
 const i=seg(s);if(s<=TT[i][1]||i==B.length-1)for(const f of folOf(i)){const dd=Math.hypot(f.x-q.x,f.y-q.y);if(dd<.6&&(!best||dd<best[0]))best=[dd,(f.n?(f.leader?'Follower von '+f.n:f.n):'Follower')+': '+where(f.x,f.y)]}
 if(best)showTip(ev,best[1]);else tip.style.display='none'});
let lastCur=-1;
function draw(){const s=t/10,i=seg(s);const ci=(s<=TT[i][1]||i==B.length-1)?i:i+1;if(ci!==lastCur){lastCur=ci;renderCur(ci)}
 if(i!==cur){cur=i;paths(i)}
 for(const n of N){const [x,y]=pos(n,s);const hid=B[i].x&&B[i].x.includes(n)&&(s<=TT[i][1]||i==B.length-1);dot[n].style.display=lab[n].style.display=hid?'none':'';dot[n].setAttribute('cx',x);dot[n].setAttribute('cy',y);lab[n].setAttribute('x',x);lab[n].setAttribute('y',y+.02)}
 gF.innerHTML='';const fl=(s<=TT[i][1]||i==B.length-1)?D.F[i]:null;if(!(s<=TT[i][1]||i==B.length-1)&&D.FT&&D.FT[i]){const w=(s-TT[i][1])/(TT[i+1][0]-TT[i][1]);for(const f of D.FT[i]){if(f.h&&w>f.h)continue;const p=f.h?wpt(f.p,w):(f._s||(f._s=(P=>[P,arc(P)])(smooth(f.p.map(q=>[q[1],q[2]])))),along(f._s[0],f._s[1],w));el('circle',{cx:p[0],cy:p[1],r:.32,fill:'rgba(255,255,255,.6)',stroke:C[f.n],'stroke-width':.08,'stroke-dasharray':'.12 .08'},gF);const tx=el('text',{x:p[0],y:p[1]+.02,'font-size':f.n.length>1?.28:.34,'font-weight':700,fill:f.n=='JN'?'#9a7d00':C[f.n],'text-anchor':'middle','dominant-baseline':'central'},gF);tx.textContent=f.n}}
 if(fl)for(const q of fl){if(q[3]){el('circle',{cx:q[0],cy:q[1],r:.3,fill:'rgba(255,255,255,.6)',stroke:q[3],'stroke-width':.09,'stroke-dasharray':'.12 .08'},gF);const tx=el('text',{x:q[0],y:q[1]+(q[4]=='top'?-.45:.62),'font-size':.3,'font-weight':600,fill:'#334','text-anchor':'middle'},gF);tx.textContent=q[2];continue}const c=q[2]?C[q[2]]:'#555';el('circle',{cx:q[0],cy:q[1],r:.32,fill:'rgba(255,255,255,.6)',stroke:c,'stroke-width':.08,'stroke-dasharray':'.12 .08'},gF);if(q[2]){const tx=el('text',{x:q[0],y:q[1]+.02,'font-size':q[2].length>1?.28:.34,'font-weight':700,fill:c=='#f2c400'?'#9a7d00':c,'text-anchor':'middle','dominant-baseline':'central'},gF);tx.textContent=q[2]}}
 const hold=s<=TT[i][1]||i==B.length-1;
 document.getElementById('tm').textContent=(hold?'Bild '+(i+1)+' von '+B.length:'Wechsel')+(s<=71?' · Video '+Math.floor(s)+' s':'');
 document.getElementById('bn').textContent=hold?title(i):'→ '+title(i+1)}
function set(v){t=Math.max(0,Math.min(+sl.max,Math.round(v)));sl.value=t;draw()}
function stop(){clearInterval(play);play=null;document.getElementById('pl').textContent='▶'}
document.getElementById('pl').onclick=()=>{if(play){stop();return}if(t>=+sl.max)set(0);document.getElementById('pl').textContent='❚❚';play=setInterval(()=>{if(t>=+sl.max){stop();return}set(t+1)},100/spd)};
document.getElementById('sp').onclick=e=>{spd=spd==1?2:spd==2?.5:1;e.target.textContent=String(spd).replace('.',',')+'×';if(play){stop();document.getElementById('pl').click()}};

 N.forEach(n=>{if(b.x&&b.x.includes(n))return;h+='<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:'+C[n]+'"></span>'+n+'</td><td>'+fm(b.p[n][0])+' : '+fm(b.p[n][1])+'</td></tr>'});d.innerHTML=h+'</table>';
