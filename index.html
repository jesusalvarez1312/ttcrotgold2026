function ideal(n,s){for(let i=0;i<KB.length;i++){const b=KB[i];if(s>=b.t[0]&&s<=b.t[1])return b.p[n];if(i<KB.length-1&&s>b.t[1]&&s<KB[i+1].t[0]){const w=(s-b.t[1])/(KB[i+1].t[0]-b.t[1]),a=b.p[n],c=KB[i+1].p[n];if(b.n=='Zwei Reihen, nach hinten')return bzw(n,w);return i<=1?walk(a,c,w):[a[0]+(c[0]-a[0])*w,a[1]+(c[1]-a[1])*w]}}return KB[KB.length-1].p[n]}
function real(n,s){if(s>131){const A=REAL3[n],f=Math.min(A.length-1,(s-129)*5),i=Math.floor(f),j=Math.min(A.length-1,i+1),w=f-i;return[A[i][0]+(A[j][0]-A[i][0])*w,A[i][1]+(A[j][1]-A[i][1])*w]}if(s>70){const A=REAL2[n],f=Math.min(A.length-1,(s-70+24)*5),i=Math.floor(f),j=Math.min(A.length-1,i+1),w=f-i;return[A[i][0]+(A[j][0]-A[i][0])*w,A[i][1]+(A[j][1]-A[i][1])*w]}
 const f=Math.min(349,s*5),i=Math.floor(f),j=Math.min(349,i+1),w=f-i,a=REAL[n][i],c=REAL[n][j];return[a[0]+(c[0]-a[0])*w,a[1]+(c[1]-a[1])*w]}
function dz(i){const x=SEC.find(c=>c.b.includes(i));return x?x.n+' · ':''}
function bild(s){for(let i=0;i<B.length;i++){const b=B[i];if(b.pass&&Math.abs(s-b.t[0])<.5)return dz(i)+'Bild '+(i+1)+' · '+b.n;}for(let i=0;i<B.length;i++){const b=B[i];if(b.pass)continue;if(s>=b.t[0]&&s<=b.t[1])return dz(i)+'Bild '+(i+1)+' · '+b.n;let j=i+1;while(j<B.length&&B[j].pass)j++;if(j<B.length&&s>b.t[1]&&s<B[j].t[0])return 'Wechsel → '+dz(j)+'Bild '+(j+1)}return ''}
const NS='http://www.w3.org/2000/svg',S=document.getElementById('f');
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||S).appendChild(e);return e}
for(let i=-8;i<=8;i++){el('line',{x1:i,y1:-8,x2:i,y2:8,stroke:'#d3e0f2','stroke-width':.03});el('line',{x1:-8,y1:i,x2:8,y2:i,stroke:'#d3e0f2','stroke-width':.03})}
el('rect',{x:-7,y:-7,width:14,height:14,fill:'none',stroke:'#7d97c2','stroke-width':.06,'stroke-dasharray':'.3 .2'});
el('line',{x1:-8,y1:0,x2:8,y2:0,stroke:'#14213d','stroke-width':.05});el('line',{x1:0,y1:-8,x2:0,y2:8,stroke:'#fff','stroke-width':.08});
el('circle',{cx:0,cy:0,r:1.8,fill:'none',stroke:'#14213d','stroke-width':.05});
const mm=v=>String(v).replace('-','−'),f1=v=>(Math.round(v*10)/10).toFixed(1).replace('.',',').replace('-','−');
for(let v=-6;v<=6;v+=2){el('text',{x:v,y:8.35,'font-size':.4,'text-anchor':'middle',fill:'#7d97c2'}).textContent=mm(v);el('text',{x:-8.35,y:v+.14,'font-size':.4,fill:'#7d97c2'}).textContent=mm(v)}


const gT=el('g',{}),gF=el('g',{}),gG=el('g',{}),gP=el('g',{});const tr={},dot={},lab={},gh={};
for(const n of N){tr[n]=el('polyline',{fill:'none',stroke:C[n],'stroke-width':.07,opacity:.5,'stroke-linejoin':'round'},gT);
 gh[n]=el('circle',{r:.28,fill:'none',stroke:C[n],'stroke-width':.07,'stroke-dasharray':'.12 .08'},gG)}
for(const n of N){dot[n]=el('circle',{r:.28,fill:C[n],stroke:n=='W'?'#7a6400':'#fff','stroke-width':.06},gP);lab[n]=el('text',{'font-size':.45,'font-weight':700,fill:n=='W'?'#9a7d00':C[n]},gP);lab[n].textContent=n}
let mode='I',t=0,play=null,spd=1;const sl=document.getElementById('sl');
const P=(n,s)=>mode=='R'?real(n,s):ideal(n,s);
let part=1;function paths(){const a=[0,0,70,131][part],e=[0,70,131,239.5][part];for(const n of N){const pts=[];for(let s=a;s<=e+1e-9;s+=.1)pts.push(P(n,s).map(v=>v.toFixed(2)).join(','));tr[n].setAttribute('points',pts.join(' '))}}
function fol(s){for(const b of B){if(s>=b.t[0]&&s<=b.t[1]){if(b.n.startsWith('Pyramide'))return[-3.5,-2.5,-1.5,-0.5,0.5,1.5,2.5,3.5].map(x=>[x,-3]);if(b.f)return Object.entries(b.f).map(([k,v])=>[v[0],v[1],k])}}return[]}
function draw(){const s=t/10;gF.innerHTML='';for(const q of fol(s)){el('circle',{cx:q[0],cy:q[1],r:.28,fill:'rgba(255,255,255,.35)',stroke:'#555','stroke-width':.06,'stroke-dasharray':'.1 .08'},gF);if(q[2])el('text',{x:q[0]+.33,y:q[1]+.55,'font-size':.38,fill:'#555','font-style':'italic'},gF).textContent=q[2]}const np=s<=70?1:s<=131?2:3;if(np!=part){part=np;paths()}for(const n of N){const [x,y]=P(n,s);dot[n].setAttribute('cx',x);dot[n].setAttribute('cy',y);lab[n].setAttribute('x',x+.33);lab[n].setAttribute('y',y-.28);
 const [gx,gy]=ideal(n,s);gh[n].setAttribute('cx',gx);gh[n].setAttribute('cy',gy)}
 gG.style.display=mode=='R'&&document.getElementById('gh').checked?'':'none';
 document.getElementById('tm').textContent=s<=70?'Teil 1 · '+s.toFixed(1).replace('.',',')+' s':s<=131?'Teil 2 · '+(s-46).toFixed(1).replace('.',',')+' s':'Teil 3 · '+(s-129).toFixed(1).replace('.',',')+' s';document.getElementById('bn').textContent=bild(s);
 document.querySelectorAll('.bild').forEach(d=>{const b=B[+d.dataset.i];d.classList.toggle('act',s>=b.t[0]&&s<=b.t[1])})}
function set(v){t=Math.max(0,Math.min(2395,Math.round(v)));sl.value=t;draw()}
function stop(){clearInterval(play);play=null;document.getElementById('pl').textContent='▶'}
document.getElementById('pl').onclick=()=>{if(play){stop();return}if(t>=2395)set(0);document.getElementById('pl').textContent='❚❚';play=setInterval(()=>{if(t>=2395){stop();return}set(t+1)},100/spd)};
document.getElementById('sp').onclick=e=>{spd=spd==1?2:spd==2?.5:1;e.target.textContent=String(spd).replace('.',',')+'×';if(play){stop();document.getElementById('pl').click()}};
sl.oninput=()=>{stop();set(+sl.value)};
function jump(d){stop();const s=t/10,st=B.map(b=>b.t[0]);let k;if(d>0){k=st.findIndex(x=>x>s+.05);if(k<0)return}else{const c=st.filter(x=>x<s-.05);if(!c.length){set(0);return}k=st.lastIndexOf(c[c.length-1])}set(Math.round(st[k]*10))}
document.getElementById('pv').onclick=()=>jump(-1);document.getElementById('nx').onclick=()=>jump(1);
document.getElementById('tr').onchange=e=>{gT.style.display=e.target.checked?'':'none'};
document.getElementById('gh').onchange=draw;
function setMode(m){mode=m;document.getElementById('mR').classList.toggle('on',m=='R');document.getElementById('mI').classList.toggle('on',m=='I');
 document.getElementById('ghL').style.display=m=='R'?'':'none';
 document.getElementById('nt').textContent=m=='R'?'':'';
 paths();draw()}
document.getElementById('mR').onclick=()=>setMode('R');document.getElementById('mI').onclick=()=>setMode('I');
function meas(n,b,i){let x=0,y=0,k=0;for(let s=b.t[0];s<=b.t[1]+1e-9;s+=.2){const p=real(n,s);x+=p[0];y+=p[1];k++}return[x/k,y/k]}
const acc=document.getElementById('acc');
SEC.forEach((sec,si)=>{const d=document.createElement('details');
 const nums=sec.b.map(i=>i+1).join(' + ');let h='<summary><span>'+sec.n+'<small>Bild '+nums+'</small></span></summary>';
 sec.b.forEach(i=>{const b=B[i];h+='<div class="bild" data-i="'+i+'"><h3><span>Bild '+(i+1)+' · '+b.n+' <small style="color:#888;font-weight:400">'+(i>=14?'Teil 3 · '+(b.t[0]-129)+'–'+(b.t[1]-129)+' s':i>=6?'Teil 2 · '+(b.t[0]==b.t[1]?(b.t[0]-46).toFixed(1).replace('.',','):(b.t[0]-46)+'–'+(b.t[1]-46))+' s':'Teil 1 · '+(b.t[0]==b.t[1]?b.t[0]:b.t[0]+'–'+b.t[1])+' s')+'</small></span><button data-go="'+b.t[0]+'">Ansehen</button></h3><table><tr><th>Leader</th><th>Ideal</th><th>8. Nov.</th></tr>';
  N.forEach(n=>{const m=meas(n,b,i);h+='<tr><td><span class="dot" style="background:'+C[n]+'"></span>'+n+'</td><td>'+(b.pass?f1(b.p[n][0])+' : '+f1(b.p[n][1]):mm(b.p[n][0])+' : '+mm(b.p[n][1]))+'</td><td>'+(m?f1(m[0])+' : '+f1(m[1]):'–')+'</td></tr>'});
  h+='</table></div>'});
 d.innerHTML=h;acc.appendChild(d)});
acc.querySelectorAll('button[data-go]').forEach(b=>b.onclick=()=>{stop();set(+b.dataset.go*10);window.scrollTo({top:0,behavior:'smooth'})});
setMode('I');gT.style.display='none';
</script></body></html>
